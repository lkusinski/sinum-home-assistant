set_virtual_temperature:
  name: Set virtual temperature
  description: Writes a temperature value to a Sinum virtual temperature sensor.
  fields:
    device_id:
      name: Device ID
      description: Numeric ID of the Sinum virtual custom device (temperature_sensor).
      required: true
      selector:
        number:
          min: 1
          max: 999999
          mode: box
    temperature:
      name: Temperature
      description: Temperature in degrees Celsius.
      required: true
      selector:
        number:
          min: -20
          max: 60
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

refresh:
  name: Refresh
  description: Force an immediate refresh of Sinum data.
